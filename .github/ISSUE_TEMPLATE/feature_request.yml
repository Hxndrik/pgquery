name: Feature request
description: Suggest a screen, check or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution. What is slow or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
