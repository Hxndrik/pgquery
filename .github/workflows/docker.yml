name: Docker image

# Image tags on ghcr.io/hxndrik/pgquery:
#   latest, 1.2.3, 1.2  newest release (built when a release is published)
#   main, sha-abc1234   every push to main (bleeding edge)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.0.1
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # A release build: called with a tag, or a v* tag was pushed by hand.
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pgquery
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=main,enable=${{ env.RELEASE_TAG == '' }}
            type=sha,format=short,enable=${{ env.RELEASE_TAG == '' }}
          labels: |
            org.opencontainers.image.title=pgquery
            org.opencontainers.image.description=Free, open-source Postgres GUI in your browser
            org.opencontainers.image.url=https://pgquery.dev
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
