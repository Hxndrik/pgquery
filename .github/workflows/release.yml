name: Release

# release-please keeps a "chore(main): release x.y.z" pull request open with the
# next version and changelog, built from conventional commit messages
# (fix: → patch, feat: → minor). Merging it tags the release, publishes the
# GitHub Release and builds the versioned Docker images.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags created with GITHUB_TOKEN don't trigger other workflows, so the
  # release image is built here by calling the Docker workflow directly.
  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
