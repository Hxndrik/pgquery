name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Pre-existing react-hooks/set-state-in-effect findings; reported, not blocking yet.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    # A throwaway Postgres for the type round-trip test (TestTypeEdgeCasesRoundTrip).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGQUERY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
